<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0e17">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>StealthVoice & Video — Encrypted Calling</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: #141b2d;
            --card-border: #1e293b;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .phone-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
        }

        .app-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .settings-btn {
            background: #1e293b;
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: #334155;
            color: #fff;
        }

        .network-badge {
            align-self: flex-start;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            margin-bottom: 16px;
        }

        /* Video Area */
        .video-container {
            width: 100%;
            height: 240px;
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: none;
            margin-bottom: 16px;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #050811;
        }

        #localVideo {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            background: #111;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .room-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .room-input:focus {
            border-color: var(--accent-blue);
        }

        .call-timer {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-green);
            margin: 10px 0 6px 0;
            display: none;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .mic-meter-container {
            width: 100%;
            height: 5px;
            background: #1e293b;
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
        }

        .mic-meter-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            transition: width 0.05s ease;
        }

        .call-actions-pre {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .call-actions-in {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-voice { background-color: var(--accent-green); color: white; }
        .btn-video { background-color: #2563eb; color: white; }
        .btn-hangup { background-color: var(--accent-red); color: white; grid-column: span 2; }
        .btn-ctrl { background-color: #1e293b; color: white; }

        .status-box {
            margin-top: 16px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
        }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            color: white;
            margin-bottom: 4px;
            background: #64748b;
        }

        .status-detail {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .setting-field {
            margin-bottom: 14px;
            text-align: left;
        }

        .setting-field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .setting-field input, .setting-field select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: white;
            font-size: 14px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            font-size: 13px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div class="phone-card">
        <div class="header">
            <div class="logo-area">
                <img src="/icon.svg" class="logo-icon" alt="Logo">
                <span class="app-title">StealthVoice & Video</span>
            </div>
            <button class="settings-btn" onclick="openSettings()" title="Network & Firewall Settings">⚙️</button>
        </div>

        <div id="networkModeBadge" class="network-badge">⚡ Hybrid P2P / Direct</div>

        <!-- Video Call Screens -->
        <div id="videoContainer" class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="input-group">
            <label class="input-label" for="roomInput">Private Room Line</label>
            <input type="text" id="roomInput" class="room-input" placeholder="e.g. secret-line-1" value="secret-line-1">
        </div>

        <div id="callTimer" class="call-timer">00:00</div>

        <div class="mic-meter-container" title="Audio Activity">
            <div id="micMeter" class="mic-meter-bar"></div>
        </div>

        <!-- Before Call Actions -->
        <div id="preCallActions" class="call-actions-pre">
            <button class="btn btn-voice" onclick="startCall(false)">
                <span>📞 Voice Call</span>
            </button>
            <button class="btn btn-video" onclick="startCall(true)">
                <span>📹 Video Call</span>
            </button>
        </div>

        <!-- In-Call Actions -->
        <div id="inCallActions" class="call-actions-in" style="display: none;">
            <button id="muteBtn" class="btn btn-ctrl" onclick="toggleMute()">
                <span>🎤 Mute</span>
            </button>
            <button id="videoToggleBtn" class="btn btn-ctrl" onclick="toggleVideo()">
                <span>📷 Cam Off</span>
            </button>
            <button id="flipCamBtn" class="btn btn-ctrl" onclick="flipCamera()">
                <span>🔄 Flip</span>
            </button>
            <button id="speakerBtn" class="btn btn-ctrl" onclick="toggleSpeaker()">
                <span>🔊 Speaker</span>
            </button>
            <button class="btn btn-hangup" onclick="endCall()">
                <span>🔴 Hang Up</span>
            </button>
        </div>

        <div class="status-box">
            <span id="statusBadge" class="status-badge">Ready</span>
            <div id="statusDetail" class="status-detail">Choose Voice or Video call to start.</div>
        </div>

        <audio id="remoteAudio" autoplay playsinline></audio>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">Firewall & Codec Settings</h3>

            <div class="setting-field">
                <label>Audio Bitrate (Lower = Best on 2G/Weak Signal)</label>
                <select id="bitrateSelect">
                    <option value="8000">8 kbps (Ultra-Low / Weakest Signal)</option>
                    <option value="12000" selected>12 kbps (Recommended Clear Voice)</option>
                    <option value="16000">16 kbps (High Quality)</option>
                </select>
            </div>

            <div class="setting-field">
                <label>Video Quality Mode</label>
                <select id="videoQualitySelect">
                    <option value="low" selected>Low (360p / 15fps - Saves Data)</option>
                    <option value="medium">Medium (480p / 24fps)</option>
                    <option value="high">Standard (720p / 30fps)</option>
                </select>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" id="forceRelayCheckbox">
                <span><strong>Force Stealth Relay (Port 443)</strong><br><small style="color:var(--text-muted)">Bypasses UAE/ISP VoIP blocks by wrapping traffic in TLS</small></span>
            </label>

            <div class="setting-field">
                <label>Custom TURN Server (e.g. standard.metered.ca:443)</label>
                <input type="text" id="turnServerInput" placeholder="turns:your-turn-host:443?transport=tcp">
            </div>

            <div class="setting-field">
                <label>TURN Username</label>
                <input type="text" id="turnUserInput" placeholder="Metered / Custom username">
            </div>

            <div class="setting-field">
                <label>TURN Credential / Password</label>
                <input type="password" id="turnPassInput" placeholder="Metered / Custom password">
            </div>

            <div class="modal-actions">
                <button class="btn btn-voice" style="padding:10px; width:50%;" onclick="saveSettings()">Save</button>
                <button class="btn btn-ctrl" style="padding:10px; width:50%;" onclick="closeSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Settings updated</div>

    <script src="/app.js"></script>
</body>
</html>
